<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業利益率維持シミュレーター｜千房グループ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo UI','Meiryo','メイリオ',sans-serif;background:#f5f2ee;color:#1a1a1a;font-size:13px;line-height:1.5}
:root{--crimson:#8B0000;--crimson-light:#b8001f;--gold:#c9a84c;--bg:#f5f2ee;--card:#fff;--border:#ddd;--muted:#666;--green:#0a6e3f;--amber:#9a5c00;--red:#c0392b;--blue:#185fa5}

/* ヘッダー */
.header{background:var(--crimson);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.header h1{font-size:16px;font-weight:700;letter-spacing:.05em}
.header-sub{font-size:11px;opacity:.8;margin-top:2px}
.header-badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px}

/* レイアウト */
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto;align-items:start}

/* カード共通 */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-head{background:var(--crimson);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-body{padding:14px}

/* フォーム */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:700}
.field select,.field input[type=text],.field input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:#1a1a1a}
.field select:focus,.field input:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 2px rgba(139,0,0,.12)}

/* シナリオ入力 */
.scenario-list{display:flex;flex-direction:column;gap:6px}
.sc-col-labels{display:grid;grid-template-columns:68px 82px 1fr 36px;gap:5px;margin-bottom:2px}
.sc-col-labels span{font-size:10px;color:var(--muted);text-align:center;font-weight:700}
.scenario-item{display:grid;grid-template-columns:68px 82px 1fr 36px;gap:5px;align-items:center}
.scenario-item input[type=number]{padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;text-align:right;width:100%}
.scenario-item input:focus{outline:none;border-color:var(--crimson)}
.pct-input-wrap{position:relative}
.pct-input-wrap input{padding-right:22px}
.pct-input-wrap::after{content:'%';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-align:center;white-space:nowrap}
.tag-base{background:#d4edda;color:#155724}
.tag-custom{background:#fff3cd;color:#856404}
.tag-warn{background:#ffe5d0;color:#8c3a00}
.tag-danger{background:#fde8e8;color:#8b0000}
.btn-del{background:none;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;width:32px;height:32px}
.btn-del:hover{border-color:var(--red);color:var(--red)}
.btn-add{width:100%;padding:7px;background:none;border:1px dashed var(--border);border-radius:5px;font-size:11px;color:var(--muted);cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-add:hover{border-color:var(--crimson);color:var(--crimson)}

/* 実行ボタン */
.btn-run{width:100%;padding:10px;background:var(--crimson);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;margin-top:4px;transition:background .15s}
.btn-run:hover{background:var(--crimson-light)}

/* KPIカード */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#f8f6f2;border-radius:7px;padding:10px 12px;border-left:3px solid var(--gold)}
.kpi-label{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:3px}
.kpi-val{font-size:20px;font-weight:700;color:var(--crimson)}
.kpi-note{font-size:10px;color:var(--muted);margin-top:2px}

/* 賃料タイプバッジ */
.rent-badge{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}
.rent-fixed{background:#e8f4f8;color:#0a5275}
.rent-variable{background:#fff3cd;color:#856404}

/* 結果テーブル */
.result-wrap{overflow-x:auto}
.result-table{width:100%;border-collapse:collapse;font-size:12px;min-width:780px}
.result-table th{padding:8px 10px;text-align:right;font-size:11px;font-weight:700;color:#fff;background:var(--crimson);white-space:nowrap;border-right:1px solid rgba(255,255,255,.15)}
.result-table th:first-child{text-align:left;border-radius:0}
.result-table th.budget-col{background:#6d0000}
.result-table td{padding:7px 10px;text-align:right;border-bottom:1px solid #eee;border-right:1px solid #f0f0f0}
.result-table td:first-child{text-align:left;font-weight:700;white-space:nowrap}
.result-table tr:hover td{background:#fdf8f2}
.result-table tr.budget-row td{background:#fdf5e6;font-weight:700}
.result-table tr.budget-row td:first-child{color:var(--crimson)}

.num{font-variant-numeric:tabular-nums}
.delta-neg{color:var(--red);font-weight:700}
.delta-pos{color:var(--green);font-weight:700}

.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.pill-ok{background:#d4edda;color:#155724}
.pill-warn{background:#fff3cd;color:#856404}
.pill-ng{background:#fde8e8;color:#8b0000}
.pill-na{background:#f0f0f0;color:#999}

/* ゲージ行 */
.gauge-wrap{margin-top:16px}
.gauge-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
.gauge-item{margin-bottom:9px}
.gauge-header{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.gauge-track{background:#eee;border-radius:4px;height:13px;overflow:hidden;position:relative}
.gauge-fill{height:100%;border-radius:4px;transition:width .5s ease}
.g-base{background:#0a6e3f}
.g-s1{background:#c9a84c}
.g-s2{background:#e67e22}
.g-s3{background:#c0392b}
.g-s4{background:#8e44ad}
.g-s5{background:#185fa5}

/* 内訳パネル */
.detail-section{margin-top:16px}
.detail-title{font-size:12px;font-weight:700;color:var(--crimson);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.detail-card{border:1px solid var(--border);border-radius:7px;padding:10px 12px}
.detail-card-head{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.detail-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f5f5f5}
.detail-row:last-child{border-bottom:none;padding-top:5px;margin-top:2px;font-weight:700;color:var(--crimson)}
.detail-diff{font-size:10px}

/* タブ */
.tab-row{display:flex;gap:4px;margin-bottom:12px}
.tab{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:#fff;font-family:inherit}
.tab.active{background:var(--crimson);color:#fff;border-color:var(--crimson)}

/* 注記 */
.footnote{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.7;background:#f8f6f2;padding:8px 10px;border-radius:5px;border-left:3px solid var(--gold)}

/* 空状態 */
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:8px}

/* 賃料タイプ説明 */
.rent-note{font-size:10px;background:#fff8e1;border:1px solid #ffe082;border-radius:5px;padding:6px 8px;margin-top:6px;color:#5c4300;line-height:1.6}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr}
}
</style>
</head>

function sumPeriod(arr, idxs){ return idxs.reduce((s,i)=>s+(arr[i]||0),0); }

function calcRent(store, sales_k, idxs){
  // 賃借料の逆算：歩合型は見込み売上に連動、固定型はそのまま
  if(store.rentType==="fixed"){
    return sumPeriod(store.rent, idxs);
  } else {
    // 歩合型：見込み売上×歩率、ただし最低保証あり（月次ベースで合計）
    const rate = store.rentRate || 0;
    const minMonthly = store.rentMin ? store.rentMin/1000 : 0; // 千円換算
    const fixed = store.rentFixed ? store.rentFixed/1000 : 0;
    let total = 0;
    idxs.forEach(i => {
      const mSales = sales_k / idxs.length; // 月平均
      const budgetMSales = store.sales[i];
      // 月比率で按分
      const salesRatio = budgetMSales > 0 ? mSales / budgetMSales : 1;
      const simMSales = budgetMSales * salesRatio;
      let mRent;
      if(fixed > 0){
        // 固定+歩合型
        const over = Math.max(0, simMSales - (store.rentMin ? store.rentMin/1000 : 0));
        mRent = fixed + over * rate;
        mRent = Math.max(mRent, minMonthly);
      } else {
        mRent = Math.max(simMSales * rate, minMonthly);
      }
      total += mRent;
    });
    return Math.round(total);
  }
}

// 精密な歩合賃料計算（月別）
function calcRentFromMonthlyRatio(store, simSalesTotal, idxs){
  if(store.rentType==="fixed"){
    return sumPeriod(store.rent, idxs);
  }
  const rate = store.rentRate || 0;
  const minMonthly = store.rentMin ? store.rentMin/1000 : 0;
  const fixedMonthly = store.rentFixed ? store.rentFixed/1000 : 0;
  const budgetTotal = sumPeriod(store.sales, idxs);
  let total = 0;
  idxs.forEach(i => {
    const bSales = store.sales[i];
    const simSales = budgetTotal > 0 ? (bSales / budgetTotal) * simSalesTotal : bSales;
    let mRent;
    if(fixedMonthly > 0){
      mRent = fixedMonthly + Math.max(0, simSales - minMonthly) * rate;
    } else {
      mRent = Math.max(simSales * rate, minMonthly);
    }
    total += mRent;
  });
  return Math.round(total);
}

function updateBudgetInfo(){
  if(!currentStore) return;
  const val = document.getElementById("periodSelect").value;
  const key = isNaN(val) ? val : parseInt(val);
  currentPeriodIdxs = PERIOD_IDXS[key];
  const s = currentStore;
  const idxs = currentPeriodIdxs;
  const bSales = sumPeriod(s.sales, idxs);
  const bCogs = sumPeriod(s.cogs, idxs);
  const bLabor = sumPeriod(s.labor, idxs);
  const bRent = sumPeriod(s.rent, idxs);
  const bOp = sumPeriod(s.opInc, idxs);
  const opRate = bSales > 0 ? (bOp/bSales*100).toFixed(1) : "-";
  const cogsRate = bSales > 0 ? (bCogs/bSales*100).toFixed(1) : "-";
  const laborRate = bSales > 0 ? (bLabor/bSales*100).toFixed(1) : "-";
  const rentRate = bSales > 0 ? (bRent/bSales*100).toFixed(1) : "-";
  const rBadge = s.rentType==="fixed"
    ? `<span class="rent-badge rent-fixed">固定賃料</span>`
    : `<span class="rent-badge rent-variable">歩合賃料 (${(s.rentRate*100).toFixed(0)}%)</span>`;
  document.getElementById("budgetInfo").innerHTML = `
    <div style="background:#fdf8f0;border:1px solid #e8dcc0;border-radius:6px;padding:10px 12px;font-size:11px">
      <div style="font-weight:700;color:var(--crimson);margin-bottom:7px;font-size:12px">📋 予算値（目標営業利益率：固定）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
        <div>売上：<strong>${bSales.toLocaleString()}</strong>千円</div>
        <div>営業利益率：<strong style="color:${parseFloat(opRate)>0?'var(--green)':'var(--red)'}">${opRate}%</strong></div>
        <div>原価率：<strong>${cogsRate}%</strong></div>
        <div>人件費率：<strong>${laborRate}%</strong></div>
        <div>賃借料率：<strong>${rentRate}%</strong> ${rBadge}</div>
        <div>営業利益：<strong>${bOp.toLocaleString()}</strong>千円</div>
      </div>
    </div>`;
  const rentNote = s.rentType==="variable"
    ? `<div class="rent-note">⚡ 歩合賃料：見込み売上 × ${(s.rentRate*100).toFixed(0)}%${s.rentMin?`（最低保証 ${(s.rentMin/1000).toFixed(0)}千円/月）`:''}${s.rentFixed?`＋固定 ${(s.rentFixed/1000).toFixed(0)}千円/月`:''}<br>→ シミュレーションでは売上変動に連動して自動計算</div>`
    : `<div class="rent-note">🔒 固定賃料：${(s.rentFixed||s.rentMin||0)/1000}千円/月（売上に関係なく一定）</div>`;
  document.getElementById("rentInfo").innerHTML = rentNote;
}

// シナリオ管理
let scenarioId = 0;
function addPreset(pct){
  const s = currentStore || STORES[0];
  const idxs = currentPeriodIdxs;
  const bSales = sumPeriod(s.sales, idxs);
  scenarios.push({id:++scenarioId, pct:pct, sales: Math.round(bSales*(1+pct/100))});
}
function addScenario(){
  const s = currentStore || STORES[0];
  const idxs = currentPeriodIdxs;
  const bSales = sumPeriod(s.sales, idxs);
  scenarios.push({id:++scenarioId, pct:-10, sales: Math.round(bSales*0.9)});
  renderScenarios();
}
function removeScenario(id){
  scenarios = scenarios.filter(s=>s.id!==id);
  renderScenarios();
}

// %入力から売上を更新
function onPctInput(i, val){
  const pct = parseFloat(val);
  if(isNaN(pct)) return;
  const s = currentStore || STORES[0];
  const bSales = sumPeriod(s.sales, currentPeriodIdxs);
  scenarios[i].pct = pct;
  scenarios[i].sales = Math.round(bSales * (1 + pct/100));
  // 売上欄だけ更新（再描画せず）
  const salesInput = document.getElementById('sc-sales-'+scenarios[i].id);
  if(salesInput) salesInput.value = scenarios[i].sales;
  updateScTag(i);
}

// 売上入力から%を更新
function onSalesInput(i, val){
  const sales = parseInt(val) || 0;
  const s = currentStore || STORES[0];
  const bSales = sumPeriod(s.sales, currentPeriodIdxs);
  scenarios[i].sales = sales;
  scenarios[i].pct = bSales > 0 ? parseFloat(((sales/bSales-1)*100).toFixed(1)) : null;
  // %欄だけ更新（再描画せず）
  const pctInput = document.getElementById('sc-pct-'+scenarios[i].id);
  if(pctInput && scenarios[i].pct !== null) pctInput.value = scenarios[i].pct;
  updateScTag(i);
}

function updateScTag(i){
  const sc = scenarios[i];
  const s = currentStore || STORES[0];
  const bSales = sumPeriod(s.sales, currentPeriodIdxs);
  const pct = bSales > 0 ? (sc.sales/bSales-1)*100 : 0;
  const tagEl = document.getElementById('sc-tag-'+sc.id);
  if(!tagEl) return;
  const tagClass = pct >= 0 ? 'tag-base' : pct >= -10 ? 'tag-custom' : pct >= -20 ? 'tag-warn' : 'tag-danger';
  const label = pct >= 0 ? `▲${Math.abs(pct).toFixed(1)}%` : `▼${Math.abs(pct).toFixed(1)}%`;
  tagEl.className = 'tag '+tagClass;
  tagEl.textContent = label;
}

function renderScenarios(){
  const s = currentStore || STORES[0];
  const idxs = currentPeriodIdxs;
  const bSales = sumPeriod(s.sales, idxs);
  // pctベースのシナリオは売上を再計算
  scenarios.forEach(sc => {
    if(sc.pct !== null) sc.sales = Math.round(bSales*(1+sc.pct/100));
  });
  const list = document.getElementById("scenarioList");
  const header = `<div class="sc-col-labels">
    <span>増減率</span><span>入力%</span><span>見込み売上（千円）</span><span></span>
  </div>`;
  const rows = scenarios.map((sc,i) => {
    const pct = bSales > 0 ? (sc.sales/bSales-1)*100 : 0;
    const tagClass = pct >= 0 ? 'tag-base' : pct >= -10 ? 'tag-custom' : pct >= -20 ? 'tag-warn' : 'tag-danger';
    const label = pct >= 0 ? `▲${Math.abs(pct).toFixed(1)}%` : `▼${Math.abs(pct).toFixed(1)}%`;
    const pctVal = sc.pct !== null ? sc.pct : parseFloat((pct).toFixed(1));
    return `<div class="scenario-item">
      <span class="tag ${tagClass}" id="sc-tag-${sc.id}">${label}</span>
      <div class="pct-input-wrap">
        <input type="number" id="sc-pct-${sc.id}" value="${pctVal}" step="1" min="-99" max="200"
          oninput="onPctInput(${i}, this.value)">
      </div>
      <input type="number" id="sc-sales-${sc.id}" value="${sc.sales}" min="0" step="100"
        oninput="onSalesInput(${i}, this.value)">
      <button class="btn-del" onclick="removeScenario(${sc.id})" title="削除">×</button>
    </div>`;
  }).join('');
  list.innerHTML = header + rows;
}

// ===== シミュレーション本体 =====
function runSimulation(){
  const store = currentStore;
  if(!store){ alert("店舗を選択してください"); return; }
  if(scenarios.length===0){ alert("シナリオを追加してください"); return; }
  const idxs = currentPeriodIdxs;
  const bSales = sumPeriod(store.sales, idxs);
  const bCogs  = sumPeriod(store.cogs, idxs);
  const bLabor = sumPeriod(store.labor, idxs);
  const bRent  = sumPeriod(store.rent, idxs);
  const bOp    = sumPeriod(store.opInc, idxs);
  const targetOpRate = bSales > 0 ? bOp / bSales : 0;

  // 予算時の "その他経費"（賃借料以外の固定的経費）を逆算
  // 営業利益 = 粗利益 - 人件費 - 賃借料 - その他SGA
  // → その他SGA = 粗利益 - 人件費 - 賃借料 - 営業利益
  const bGrossProfit = bSales - bCogs;
  const bOtherSGA = bGrossProfit - bLabor - bRent - bOp;

  // 予算原価率・人件費率
  const bCogsRate = bSales > 0 ? bCogs/bSales : 0;
  const bLaborRate = bSales > 0 ? bLabor/bSales : 0;

  const results = scenarios.map((sc, i) => {
    const simSales = sc.sales;
    // 賃借料：歩合型は売上連動で自動計算
    const simRent = calcRentFromMonthlyRatio(store, simSales, idxs);
    // その他SGA：基本的に固定（スケールしない想定）
    const simOtherSGA = bOtherSGA;
    // 目標営業利益
    const targetOp = Math.round(simSales * targetOpRate);
    // 許容コスト総額
    // 粗利益 - 人件費 - 賃借料 - その他SGA = 営業利益
    // → 粗利益 - 賃借料 - その他SGA - 目標営業利益 = 最大（人件費+原価）
    const maxCogsLabor = Math.round(simSales - simRent - simOtherSGA - targetOp);
    // 原価は率を維持（変動費として売上比例）
    const simCogs = Math.round(simSales * bCogsRate);
    const maxLabor = maxCogsLabor - simCogs;
    // 達成判定
    let judgment, pillClass;
    if(maxLabor >= Math.round(simSales * bLaborRate * 0.95)){
      judgment="達成"; pillClass="pill-ok";
    } else if(maxLabor >= Math.round(bLabor * idxs.length / 12 * 0.8)){
      judgment="要調整"; pillClass="pill-warn";
    } else if(maxLabor > 0){
      judgment="困難"; pillClass="pill-ng";
    } else {
      judgment="不可"; pillClass="pill-ng";
    }
    const laborCut = maxLabor - Math.round(simSales * bLaborRate);
    const cogsRate = simSales > 0 ? (simCogs/simSales*100).toFixed(1) : "-";
    const maxLaborRate = simSales > 0 ? (maxLabor/simSales*100).toFixed(1) : "-";
    const simRentRate = simSales > 0 ? (simRent/simSales*100).toFixed(1) : "-";
    const salesPct = bSales > 0 ? ((simSales/bSales-1)*100).toFixed(1) : 0;
    const tagClass = simSales >= bSales ? 'tag-base' : parseFloat(salesPct)>=-10?'tag-custom':parseFloat(salesPct)>=-20?'tag-warn':'tag-danger';
    return {sc, simSales, salesPct, tagClass, simRent, simRentRate, simCogs, cogsRate,
            maxLabor, maxLaborRate, laborCut, targetOp, judgment, pillClass,
            simOtherSGA, maxCogsLabor};
  });

  renderResults(store, idxs, bSales, bCogs, bLabor, bRent, bOp, bOtherSGA, bCogsRate, bLaborRate, targetOpRate, results);
}

function fmt(n){ return Math.round(n).toLocaleString(); }
function fmtRate(n){ return (n*100).toFixed(1)+"%"; }

function renderResults(store, idxs, bSales, bCogs, bLabor, bRent, bOp, bOtherSGA, bCogsRate, bLaborRate, targetOpRate, results){
  const panel = document.getElementById("resultPanel");
  const periodLabel = document.getElementById("periodSelect").options[document.getElementById("periodSelect").selectedIndex].text;

  // 売上削減幅の最大（ゲージ用）
  const maxCut = Math.max(1, bSales - Math.min(...results.map(r=>r.simSales)));

  const tableRows = results.map((r,i) => {
    const gClass = i===0?'g-s1':i===1?'g-s2':i===2?'g-s3':i===3?'g-s4':'g-s5';
    const cut = r.laborCut < 0 ? `<span class="delta-neg">${fmt(r.laborCut)}</span>` : `<span class="delta-pos">+${fmt(r.laborCut)}</span>`;
    return `<tr>
      <td><span class="tag ${r.tagClass}" style="font-size:10px">${r.salesPct>=0?'▲':'▼'}${Math.abs(r.salesPct)}%</span></td>
      <td class="num">${fmt(r.simSales)}</td>
      <td class="num" style="color:var(--blue)">${fmt(r.simRent)}</td>
      <td class="num" style="font-size:10px;color:var(--muted)">${r.simRentRate}%</td>
      <td class="num">${fmt(r.simCogs)}</td>
      <td class="num" style="font-size:10px;color:var(--muted)">${r.cogsRate}%</td>
      <td class="num" style="font-weight:700;color:${r.maxLabor>0?'var(--crimson)':'var(--red)'}">${fmt(r.maxLabor)}</td>
      <td class="num" style="font-size:10px;color:var(--muted)">${r.maxLaborRate}%</td>
      <td class="num" style="font-size:11px">${cut}</td>
      <td class="num">${fmt(r.targetOp)}</td>
      <td><span class="pill ${r.pillClass}">${r.judgment}</span></td>
    </tr>`;
  });

  // ゲージ
  const gaugeItems = results.map((r,i) => {
    const gClass = i===0?'g-s1':i===1?'g-s2':i===2?'g-s3':i===3?'g-s4':'g-s5';
    const pct = bSales > 0 ? Math.round(r.simSales/bSales*100) : 0;
    const laborPct = bSales > 0 ? Math.round(r.maxLabor / Math.max(bLabor,1) * 100) : 0;
    return `<div class="gauge-item">
      <div class="gauge-header">
        <span><span class="tag ${r.tagClass}" style="font-size:10px">${r.salesPct>=0?'▲':'▼'}${Math.abs(r.salesPct)}%</span>　売上 ${fmt(r.simSales)}千円 | 人件費上限 <strong>${fmt(r.maxLabor)}</strong>千円（予算比 ${laborPct}%）</span>
        <span class="pill ${r.pillClass}" style="font-size:10px">${r.judgment}</span>
      </div>
      <div class="gauge-track">
        <div class="gauge-fill ${gClass}" style="width:${Math.min(100,Math.max(0,laborPct))}%"></div>
      </div>
    </div>`;
  });

  panel.innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <div class="card-head">📊 シミュレーション結果：${store.name}｜${periodLabel}</div>
      <div class="card-body">
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-label">予算売上</div>
            <div class="kpi-val">${fmt(bSales)}</div>
            <div class="kpi-note">千円</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">目標営業利益率（固定）</div>
            <div class="kpi-val">${(targetOpRate*100).toFixed(1)}%</div>
            <div class="kpi-note">予算 ${fmt(bOp)}千円</div>
          </div>
          <div class="kpi" style="border-left-color:${store.rentType==='variable'?'#c9a84c':'#185fa5'}">
            <div class="kpi-label">賃借料タイプ</div>
            <div class="kpi-val" style="font-size:14px">${store.rentType==='variable'?'歩合型':'固定型'}</div>
            <div class="kpi-note">${store.rentType==='variable'?`歩率 ${(store.rentRate*100).toFixed(0)}%`:`月${fmt(bRent/idxs.length)}千円`}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">予算その他SGA</div>
            <div class="kpi-val" style="font-size:16px">${fmt(bOtherSGA)}</div>
            <div class="kpi-note">千円（シミュレーション中固定）</div>
          </div>
        </div>

        <div class="result-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th style="text-align:left">シナリオ</th>
                <th>見込み売上<br><span style="font-size:10px;font-weight:400">（千円）</span></th>
                <th style="background:#1a4d7a">賃借料<br><span style="font-size:10px;font-weight:400">（千円）</span></th>
                <th style="background:#1a4d7a">賃借料率</th>
                <th>原価<br><span style="font-size:10px;font-weight:400">（千円）</span></th>
                <th>原価率</th>
                <th style="background:#6d0000">最大人件費<br><span style="font-size:10px;font-weight:400">（千円）</span></th>
                <th style="background:#6d0000">人件費率</th>
                <th>予算比<br>増減</th>
                <th>目標<br>営業利益</th>
                <th>達成</th>
              </tr>
            </thead>
            <tbody>
              <tr class="budget-row">
                <td>【予算】</td>
                <td class="num">${fmt(bSales)}</td>
                <td class="num" style="color:var(--blue)">${fmt(bRent)}</td>
                <td class="num" style="font-size:10px">${fmtRate(bRent/bSales)}</td>
                <td class="num">${fmt(bCogs)}</td>
                <td class="num" style="font-size:10px">${fmtRate(bCogsRate)}</td>
                <td class="num" style="color:var(--crimson)">${fmt(bLabor)}</td>
                <td class="num" style="font-size:10px">${fmtRate(bLaborRate)}</td>
                <td class="num" style="color:var(--muted)">—</td>
                <td class="num">${fmt(bOp)}</td>
                <td><span class="pill pill-ok">基準</span></td>
              </tr>
              ${tableRows.join('')}
            </tbody>
          </table>
        </div>

        <div class="gauge-wrap" style="margin-top:16px">
          <div class="gauge-title">人件費上限の許容度（予算比）</div>
          <div class="gauge-item">
            <div class="gauge-header"><span>【予算基準】 ${fmt(bLabor)}千円</span><span></span></div>
            <div class="gauge-track"><div class="gauge-fill g-base" style="width:100%"></div></div>
          </div>
          ${gaugeItems.join('')}
        </div>

        <div class="footnote">
          ※ 原価率は予算比率を維持（変動費として売上に比例）。<br>
          ※ 賃借料は${store.rentType==='variable'?'歩合型のため見込み売上に連動して自動計算（最低保証適用）':'固定のため売上に関係なく一定額'}。<br>
          ※ その他経費（水光熱費・広告費等）は予算値で固定扱い。<br>
          ※ 「最大人件費」は目標営業利益率を維持するための上限値。これ以内に収めることが必要。
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">📋 費用構造ウォーターフォール比較</div>
      <div class="card-body">
        <div style="overflow-x:auto">
          <table class="result-table" style="min-width:600px">
            <thead>
              <tr>
                <th style="text-align:left">科目</th>
                <th>予算</th>
                <th>予算比率</th>
                ${results.map((r,i)=>`<th style="background:${['#1a4d7a','#6d4000','#7a1a1a','#4d1a7a','#1a5a3a'][i%5]}">シナリオ${i+1}<br><span style="font-size:10px;font-weight:400">${r.salesPct>=0?'▲':'▼'}${Math.abs(r.salesPct)}%</span></th>`).join('')}
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>売上高</td>
                <td class="num">${fmt(bSales)}</td><td class="num">100.0%</td>
                ${results.map(r=>`<td class="num ${r.simSales<bSales?'delta-neg':''}">${fmt(r.simSales)}</td>`).join('')}
              </tr>
              <tr>
                <td>売上原価</td>
                <td class="num">${fmt(bCogs)}</td><td class="num">${fmtRate(bCogsRate)}</td>
                ${results.map(r=>`<td class="num">${fmt(r.simCogs)}<br><span style="font-size:10px;color:var(--muted)">${r.cogsRate}%</span></td>`).join('')}
              </tr>
              <tr>
                <td>人件費（上限）</td>
                <td class="num">${fmt(bLabor)}</td><td class="num">${fmtRate(bLaborRate)}</td>
                ${results.map(r=>`<td class="num" style="color:var(--crimson);font-weight:700">${fmt(r.maxLabor)}<br><span style="font-size:10px;color:var(--muted)">${r.maxLaborRate}%</span></td>`).join('')}
              </tr>
              <tr>
                <td>賃借料<br><span style="font-size:10px;color:var(--muted)">${store.rentType==='variable'?'(歩合)':'(固定)'}</span></td>
                <td class="num">${fmt(bRent)}</td><td class="num">${fmtRate(bRent/bSales)}</td>
                ${results.map(r=>`<td class="num" style="color:var(--blue)">${fmt(r.simRent)}<br><span style="font-size:10px;color:var(--muted)">${r.simRentRate}%</span></td>`).join('')}
              </tr>
              <tr>
                <td>その他経費（固定）</td>
                <td class="num">${fmt(bOtherSGA)}</td><td class="num">${fmtRate(bOtherSGA/bSales)}</td>
                ${results.map(r=>`<td class="num" style="color:var(--muted)">${fmt(r.simOtherSGA)}</td>`).join('')}
              </tr>
              <tr style="background:#fff8f8;font-weight:700">
                <td style="color:var(--crimson)">営業利益（目標）</td>
                <td class="num" style="color:var(--crimson)">${fmt(bOp)}</td><td class="num" style="color:var(--crimson)">${fmtRate(targetOpRate)}</td>
                ${results.map(r=>`<td class="num" style="color:var(--crimson)">${fmt(r.targetOp)}<br><span style="font-size:10px">${fmtRate(targetOpRate)}</span></td>`).join('')}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

window.onload = init;
</script>
